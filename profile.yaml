# Your job-search profile. Edit this — it drives everything.

# What kind of positions? (must appear in the job TITLE)
role_keywords:
  - werkstud          # matches Werkstudent AND Werkstudierende
  - working student
  - intern
  - internship
  - praktik           # Praktikum / Praktikant / Praktikantin
  - studentische      # Studentische Hilfskraft
  - student assistant
  - thesis            # Bachelor/Master thesis positions

# Your field (must appear somewhere in the posting)
field_keywords:
  - supply chain
  - logistics
  - operations
  - procurement
  - scm
  - data
  - analytics
  - analyst
  - business intelligence
  - machine learning
  - artificial intelligence

# Target cities (substring match on location; empty list = no city filter).
# germany_only keeps foreign offices of international companies out
# (N26 Barcelona, HelloFresh US, ...) while accepting any German location.
cities: []
germany_only: true

# Your German level: A1/A2/B1/B2/C1.
german_level: A1

# If true, jobs requiring more German than your level are NOT excluded —
# they get a score penalty and a clear red flag, and you decide.
apply_anyway: true

# Minimum LLM match score (0-100) to appear in "Today's matches"
min_score: 30

# Short pitch used by the LLM to judge fit — write it like a 3-line CV.
cv_summary: |
  M.Sc. Management & Digital Technology student at TUM seeking internships
  as the first priority, while remaining open to high-fit working student roles.

  Primary targets: Data Analyst, Business Intelligence, Business Analytics,
  Reporting, and Controlling. Secondary targets: Supply Chain, Procurement,
  Logistics, Operations Analytics, and Process Optimization. Also open to
  Product Analyst or Product Operations roles with substantial analytical work.

  Skills include Python, SQL/PostgreSQL, Excel/VBA, data visualization, and
  working knowledge of Power BI and Tableau. Built Excel dashboards covering
  50+ enterprises, identified two recurring cost inefficiencies, and automated
  payroll calculations that saved more than 10 hours per month. Also developed
  a supplier and market-price tracking database to support procurement decisions.

  Co-developed a Python data pipeline for approximately 59,000 firm-day news
  observations and evaluated portfolio performance using Fama-French regressions.
  Designed a PostgreSQL/pgvector database and user interface for an AI patent-risk
  screening tool used by non-technical users.

  Prefer internships over working student positions. Prefer the greater Stuttgart,
  Heilbronn, and Munich areas, including surrounding towns, but
  consider strong matches anywhere in Germany. German is currently A1. Do not reject
  an otherwise strong role solely because it lists a higher German requirement; flag
  the language risk and reduce the score moderately.
